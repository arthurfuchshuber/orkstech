<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" fill="none">
  <!-- ORKS — geometric techno wordmark, rounded-square stems, drawn as vector paths -->
  <!-- O: rounded rectangle outline -->
  <rect x="10" y="10" width="100" height="100" rx="22" ry="22"
        fill="none" stroke="#FFFFFF" stroke-width="18" />

  <!-- R: rounded vertical bar + rounded top loop + diagonal leg -->
  <g fill="#FFFFFF">
    <!-- left stem -->
    <rect x="135" y="10" width="18" height="100" rx="6" />
    <!-- top horizontal of bowl -->
    <rect x="135" y="10" width="68" height="18" rx="6" />
    <!-- right side of bowl -->
    <rect x="195" y="10" width="18" height="55" rx="6" />
    <!-- bottom of bowl -->
    <rect x="135" y="52" width="78" height="18" rx="6" />
    <!-- diagonal leg -->
    <path d="M 175 65 L 215 110 L 195 110 L 158 70 Z" />
  </g>

  <!-- K: vertical stem + two diagonals (electric blue accent) -->
  <g fill="#2563EB">
    <rect x="240" y="10" width="18" height="100" rx="6" />
    <!-- upper diagonal -->
    <path d="M 305 10 L 325 10 L 263 60 L 263 38 Z" />
    <!-- lower diagonal -->
    <path d="M 263 60 L 263 82 L 327 110 L 305 110 Z" />
  </g>

  <!-- S: rounded zigzag built from 3 horizontals + 2 stubs -->
  <g fill="#FFFFFF">
    <!-- top horizontal -->
    <rect x="350" y="10" width="100" height="18" rx="6" />
    <!-- middle horizontal -->
    <rect x="350" y="51" width="100" height="18" rx="6" />
    <!-- bottom horizontal -->
    <rect x="350" y="92" width="100" height="18" rx="6" />
    <!-- left top stem -->
    <rect x="350" y="10" width="18" height="50" rx="6" />
    <!-- right bottom stem -->
    <rect x="432" y="60" width="18" height="50" rx="6" />
  </g>
</svg>
